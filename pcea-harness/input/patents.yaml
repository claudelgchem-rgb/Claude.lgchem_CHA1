# =============================================================================
# PCEA Harness — 입력 설정 파일
# =============================================================================
# 이 파일은 두 가지 입력 모드를 지원한다. 하나만 활성화하라.
#   - 모드 A (explicit) : 명시적 특허번호 리스트. discovery 단계를 건너뛴다.
#   - 모드 B (discovery): 주제/검색어. patent-discovery 에이전트가 후보를 찾는다.
#
# ⚠ 불변 규칙: 청구항 원문은 파이프라인 어느 단계에서도 번역/요약/교정/
#    재배열되지 않는다. 이 설정은 "무엇을 처리할지"만 정한다.
# =============================================================================

# -----------------------------------------------------------------------------
# 모드 A: 명시적 특허번호 (이 경우 discovery 단계 건너뜀)
# -----------------------------------------------------------------------------
# mode: explicit
# patents:
#   - US10550140B2
#   - WO2019/...
#   - KR10-2021-...

# -----------------------------------------------------------------------------
# 모드 B: 주제 검색 (discovery 에이전트가 후보 특허를 찾음)
# -----------------------------------------------------------------------------
# ACTIVE RUN: J&J ICOTRODE / JNJ-2113 (icotrokinra) — oral IL-23 receptor
# antagonist peptide. 원개발: Protagonist Therapeutics (PN-235/PTG-200 계열).
mode: discovery
query: "JNJ-2113 icotrokinra oral IL-23 receptor antagonist peptide"
filters:
  assignee: [ "Janssen", "Johnson & Johnson", "Protagonist Therapeutics" ]
  date_from: "2015-01-01"
  jurisdictions: [ US, EP, WO, KR, JP ]
  max_candidates: 40

# -----------------------------------------------------------------------------
# 공통 설정 (두 모드 모두 적용)
# -----------------------------------------------------------------------------
config:
  output_language: ko        # 최종 보고서 언어 (청구항 원문은 절대 번역 안 함)
  preferred_sources: [ google_patents, espacenet, uspto_ppubs, kipris ]
  retry_limit: 2
